path: null
data_file: Y3xPlanckPR4.dataset
# WARNING: keep accuracyboost <= 3. The chi2 is converged at the default 1.0
# (differences <= 0.004 through boost 3.25), and above that the 6x2pt integration
# tables break down: chi2 shifts by +0.05 at 3.75, +0.26 at 4, +27 at 5.
accuracyboost: 1.0
internal_accuracyboost: 1.0 # C-FAST-PT convolution grid / output grid
integration_accuracy: 0 # integer 0, 1 or 2
# n(z) interpolation: 0 = cubic spline, 1 = linear, 2+ = Steffen (monotone)
photoz_interpolation_type: 0
# n(z) file z column: 0 = Z_LOW (left bin edges), 1 = Z_MID (sample points)
photoz_zmid_convention: 0
lmax: 75000 
kmax_boltzmann: 10.0
speed: 1
non_linear_emul: 2
external_nz_modeling: 0
use_emulator: 0
debug: False
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0 
# IA_code: 0 = C FASTPT, 1 = Python PAST-PT
IA_code: 0

# BIAS REDSHIFT EVOLUTION [b1,b2,bs2,b3,bmag] (see bias.c)
bias_model: [0,0,0,1,0]

add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/desy1xplanck/chains/pca.txt"
external_baryon_suppression: False

print_datavector: False
print_datavector_file: "./projects/desy1xplanck/chains/theory.modelvector"

# The point masses DES_PM1..6 act on galaxy-galaxy lensing gamma_t only.
# gk + ks + kk has no gamma_t block (probe 3x2pt_ks_gk_kk turns it off), so
# its data vector does not move with them: they are fixed at zero, not
# sampled. Each entry replaces the parameter's params_lens_maglim.yaml
# default (a value drops prior, ref and proposal, the cobaya merge rule);
# see _cosmolike_prototype_base.get_modified_defaults.
fixed_params:
  DES_PM1:
    value: 0.0
  DES_PM2:
    value: 0.0
  DES_PM3:
    value: 0.0
  DES_PM4:
    value: 0.0
  DES_PM5:
    value: 0.0
  DES_PM6:
    value: 0.0
  # The mask of Y3xPlanckPR4.dataset (DESY3xPlanckR4_6x2pt_Maglim_baseline_
  # archive.mask) keeps lens bins 1-4 only: it removes every gk entry of lens
  # bins 5-6 (gk is the only lens block of gk + ks + kk). The parameters that
  # act only on lens bins 5-6 do not move this data vector, so they are fixed
  # at their fiducial values (the ref centers of params_lens_maglim.yaml), not
  # sampled: photo-z shift DES_DZ_L5-6, linear bias DES_B1_5-6 and photo-z
  # stretch DES_DZ2_L5-6 (DES_B2_5-6 and DES_BMAG_5-6 are constants of
  # params_lens_maglim.yaml already). A mask that keeps lens bins 5-6 needs
  # these six entries removed from `fixed_params` in the user's likelihood
  # block (likelihood/README.md).
  DES_DZ_L5:
    value: 0.002
  DES_DZ_L6:
    value: 0.002
  DES_B1_5:
    value: 2.0
  DES_B1_6:
    value: 2.2
  DES_DZ2_L5:
    value: 1.08
  DES_DZ2_L6:
    value: 0.845

params: !defaults [params_source, params_lens_maglim]