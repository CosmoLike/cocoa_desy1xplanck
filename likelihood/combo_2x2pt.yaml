path: null
data_file: Y3xPlanckPR4.dataset
# WARNING: keep accuracyboost <= 3. The chi2 is converged at the default 1.0
# (differences <= 0.004 through boost 3.25), and above that the 6x2pt integration
# tables break down: chi2 shifts by +0.05 at 3.75, +0.26 at 4, +27 at 5.
accuracyboost: 1.0
internal_accuracyboost: 1.0 # C-FAST-PT convolution grid / output grid
integration_accuracy: 0 # integer 0, 1 or 2
# n(z) interpolation: 0 = cubic spline, 1 = linear, 2+ = Steffen (monotone)
photoz_interpolation_type: 0
# n(z) file z column: 0 = Z_LOW (left bin edges), 1 = Z_MID (sample points)
photoz_zmid_convention: 0
# galaxy-galaxy lensing: 1 = Limber at every multipole, 0 = non-Limber below l = 150
adopt_limber_gs: 1
# galaxy clustering: 0 = non-Limber below l = 150, 1 = Limber at every multipole
adopt_limber_gg: 0
# galaxy probes: 0 = perturbative galaxy bias, 1 = halo-model (HOD) galaxy
# power (Limber only: needs adopt_limber_gg = adopt_limber_gs = 1)
include_HOD_GX: 0
# shear and ggl IA: 0 = the IA_model above, 1 = halo-model IA
# (Fortuna et al. 2021; NLA only, Limber gs, include_HOD_GX = 0)
include_halo_IA: 0
# halo model: density field of sigma(M) and dn/dM. 0 = total matter;
# 1 = cold dark matter + baryons, as the massive neutrinos free-stream
# out of halos (sigma(M) from CAMB's delta_nonu P(k); the emulator path
# approximates it; p_mm, p_my, p_yy stop under 1)
halo_matter_field: 0
lmax: 75000 
kmax_boltzmann: 10.0
speed: 1
non_linear_emul: 2
external_nz_modeling: 0
use_emulator: 0
debug: False
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0 
# IA_code: 0 = C FASTPT, 1 = Python PAST-PT
IA_code: 0

# BIAS REDSHIFT EVOLUTION [b1,b2,bs2,b3,bmag] (see bias.c)
bias_model: [0,0,0,1,0]

add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/desy1xplanck/chains/pca.txt"
external_baryon_suppression: False

print_datavector: False
print_datavector_file: "./projects/desy1xplanck/chains/theory.modelvector"

params: !defaults [params_source, params_lens_maglim]
