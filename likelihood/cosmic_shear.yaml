path: null
data_file: Y3xPlanckPR4.dataset
# accuracyboost: the default 1.0 is the tested setting. Against a
# synthetic data vector (EXAMPLE_EVALUATE2, 6x2pt fiducial, the model at
# boost 16; 2026-10-01) chi2 = 0.014 at boost 1, 9e-4 at 2, 5e-5 from 3
# to 4 and 7e-6 at 5 (the grids refine in dyadic steps); nothing breaks
# down above 3 any more. Against the real data chi2 moves by tenths: far
# from the best fit it measures the slope of chi2, not the numerical error.
accuracyboost: 1.0
internal_accuracyboost: 1.0 # C-FAST-PT convolution grid / output grid
# refinements on top of accuracyboost (which multiplies them too):
# the non-Limber FFTLog chi grid, and the z nodes of the P(k) tables
nonlimber_accuracyboost: 1.0
pk_z_refinement: 1
integration_accuracy: 0 # integer 0, 1 or 2
# n(z) interpolation: 0 = cubic spline, 1 = linear, 2+ = Steffen (monotone)
photoz_interpolation_type: 0
# n(z) file z column: 0 = Z_LOW (left bin edges), 1 = Z_MID (sample points)
photoz_zmid_convention: 0
lmax: 75000 
kmax_boltzmann: 7.5
non_linear_emul: 2
speed: 3
external_nz_modeling: 0
use_emulator: 0
debug: False
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0
# IA_code: 0 = C FASTPT, 1 = Python PAST-PT
IA_code: 0

add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/desy1xplanck/chains/pca.txt"
external_baryon_suppression: False
print_datavector: False
print_datavector_file: "./projects/desy1xplanck/chains/theory.modelvector"

params: !defaults [params_source]
