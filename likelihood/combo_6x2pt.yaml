path: null
data_file: Y3xPlanckPR4.dataset
# accuracyboost: the default 1.0 is the tested setting. Measured on
# 2026-10-01 (EXAMPLE_EVALUATE2, 6x2pt, fiducial): chi2 moves by up to 0.45
# between boosts 1 and 5, without a trend (2283.85 at 1, 2283.89 at 2,
# 2283.41 to 2283.76 from 3 to 4, 2283.45 at 5). The 6x2pt integration
# tables no longer break down above 3: the non-Limber FFTLog guard band
# now scales with its chi grid.
accuracyboost: 1.0
internal_accuracyboost: 1.0 # C-FAST-PT convolution grid / output grid
# refinements on top of accuracyboost (which multiplies them too):
# the non-Limber FFTLog chi grid, and the z nodes of the P(k) tables
nonlimber_accuracyboost: 1.0
pk_z_refinement: 1
integration_accuracy: 0 # integer 0, 1 or 2
# n(z) interpolation: 0 = cubic spline, 1 = linear, 2+ = Steffen (monotone)
photoz_interpolation_type: 0
# n(z) file z column: 0 = Z_LOW (left bin edges), 1 = Z_MID (sample points)
photoz_zmid_convention: 0
# galaxy-galaxy lensing: 1 = Limber at every multipole, 0 = non-Limber below l = 150
adopt_limber_gs: 1
# galaxy clustering: 0 = non-Limber below l = 150, 1 = Limber at every multipole
adopt_limber_gg: 0
# galaxy probes: 0 = perturbative galaxy bias, 1 = halo-model (HOD) galaxy
# power (Limber only: needs adopt_limber_gg = adopt_limber_gs = 1)
include_HOD_GX: 0
# shear and ggl IA: 0 = the IA_model above, 1 = halo-model IA
# (Fortuna et al. 2021; NLA only, Limber gs, include_HOD_GX = 0)
include_halo_IA: 0
# halo model: density field of sigma(M) and dn/dM. 0 = total matter;
# 1 = cold dark matter + baryons, as the massive neutrinos free-stream
# out of halos (sigma(M) from CAMB's delta_nonu P(k); the emulator path
# approximates it; p_mm, p_my, p_yy stop under 1)
halo_matter_field: 0
lmax: 75000 
kmax_boltzmann: 10.0
speed: 1
non_linear_emul: 2
external_nz_modeling: 0
use_emulator: 0
debug: False
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0 
# IA_code: 0 = C FASTPT, 1 = Python PAST-PT
IA_code: 1

# BIAS REDSHIFT EVOLUTION [b1,b2,bs2,b3,bmag] (see bias.c)
bias_model: [0,0,0,1,0]

add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/desy1xplanck/chains/pca.txt"
external_baryon_suppression: False

print_datavector: False
print_datavector_file: "./projects/desy1xplanck/chains/theory.modelvector"

# The mask of Y3xPlanckPR4.dataset (DESY3xPlanckR4_6x2pt_Maglim_baseline_
# archive.mask) keeps lens bins 1-4 only: it removes every gs, gg and gk
# entry of lens bins 5-6. The parameters that act only on lens bins 5-6 do
# not move this data vector, so they are fixed at their fiducial values (the
# ref centers of params_lens_maglim.yaml), not sampled: photo-z shift
# DES_DZ_L5-6, linear bias DES_B1_5-6, photo-z stretch DES_DZ2_L5-6 and the
# point masses DES_PM5-6 (DES_B2_5-6 and DES_BMAG_5-6 are constants of
# params_lens_maglim.yaml already). Each entry replaces the parameter's
# params_lens_maglim.yaml default (a value drops prior, ref and proposal, the
# cobaya merge rule); see _cosmolike_prototype_base.get_modified_defaults.
# A mask that keeps lens bins 5-6 needs `fixed_params: null` in the user's
# likelihood block (likelihood/README.md).
fixed_params:
  DES_DZ_L5:
    value: 0.002
  DES_DZ_L6:
    value: 0.002
  DES_B1_5:
    value: 2.0
  DES_B1_6:
    value: 2.2
  DES_DZ2_L5:
    value: 1.08
  DES_DZ2_L6:
    value: 0.845
  DES_PM5:
    value: 0.0
  DES_PM6:
    value: 0.0

params: !defaults [params_source, params_lens_maglim]
